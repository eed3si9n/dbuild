name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      JVM_OPTS: "-Xms1024m -Xmx1024m -XX:ReservedCodeCacheSize=128m -XX:MaxPermSize=256m -Dfile.encoding=UTF-8"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: 8
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - name: Test
      run: |
        sbt -v "^test"
        sbt -v "^publishLocal"
        sbt -v "it:test"
